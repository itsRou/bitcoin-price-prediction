name: Daily live signal

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh-signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Generate today's signal
        run: uv run python scripts/generate_live_signal.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/live_signal.json
          git diff --cached --quiet || git commit -m "chore: refresh daily live signal [skip ci]"
          git push
