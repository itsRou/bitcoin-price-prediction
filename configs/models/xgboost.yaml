# XGBoost hyperparameter search space (Phase 5/tuning)
model: xgboost
task: regression # or classification
optuna:
  n_trials: 50
  direction: minimize
  metric: rmse
search_space:
  n_estimators: { low: 100, high: 1000 }
  max_depth: { low: 2, high: 10 }
  learning_rate: { low: 0.001, high: 0.3, log: true }
  subsample: { low: 0.5, high: 1.0 }
  colsample_bytree: { low: 0.5, high: 1.0 }
  reg_lambda: { low: 1e-3, high: 10.0, log: true }
early_stopping_rounds: 50
