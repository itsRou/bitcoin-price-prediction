[project]
name = "btcpred"
version = "0.1.0"
description = "Rigorous walk-forward benchmark of ML algorithms for BTC/USDT log-return prediction"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "polars>=1.0",
    "ccxt>=4.3",
    "yfinance>=0.2",
    "requests>=2.31",
    "pandas-ta>=0.3.14b0",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "pmdarima>=2.0",
    "arch>=7.0",
    "prophet>=1.1",
    "xgboost>=2.1",
    "lightgbm>=4.5",
    "catboost>=1.2",
    "torch>=2.3",
    "optuna>=3.6",
    "mlflow>=2.14",
    "streamlit>=1.37",
    "typer>=0.12",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "vectorbt>=0.26",
    "shap>=0.46",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "black>=24.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "responses>=0.25",
]

[project.scripts]
btcpred = "btcpred.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/btcpred"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/btcpred"]
